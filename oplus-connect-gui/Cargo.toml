[package]
name = "oplus-connect-gui"
version = "1.0.0"
edition = "2024"

[dependencies]
gpui-kit = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "time",
    "sync",
    "net",
    "io-util",
    "macros",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
base64 = "0.23"
oplus-connect-daemon = { path = "../oplus-connect-daemon" }
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-sdp = { version = "0.25", features = ["v1_24"] }
gstreamer-webrtc = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
image = { version = "0.25", default-features = false }
smallvec = "1"
ashpd = { version = "0.14", default-features = false, features = [
    "input_capture",
    "screencast",
    "remote_desktop",
    "tokio",
] }
reis = { version = "0.7.1", features = ["tokio"] }
futures-util = "0.3"
zbus = { version = "6", default-features = false, features = ["tokio"] }
ksni = { version = "0.3", features = ["blocking"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
