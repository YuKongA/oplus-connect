[package]
name = "oplus-connect-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
base64 = "0.22"
oplus-connect-daemon = { path = "../oplus-connect-daemon" }
gstreamer = { version = "0.24", features = ["v1_24"] }
gstreamer-sdp = { version = "0.24", features = ["v1_24"] }
gstreamer-webrtc = { version = "0.24", features = ["v1_24"] }
gstreamer-app = { version = "0.24", features = ["v1_24"] }
gstreamer-video = { version = "0.24", features = ["v1_24"] }
image = "0.25"
smallvec = "1"
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
