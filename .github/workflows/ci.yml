name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: pacman -Syu --needed --noconfirm git sudo rust zstd

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Resolve package dependencies
        run: |
          sudo -u builder env HOME=/home/builder bash -c \
            'source PKGBUILD && printf "%s\n" "${depends[@]}" "${makedepends[@]}"' \
            > "$RUNNER_TEMP/dependencies"

      - name: Install package dependencies
        run: |
          mapfile -t dependencies < <(grep -xE '^[[:alnum:]@._+\-]+$' "$RUNNER_TEMP/dependencies" | sort -u)
          if ((${#dependencies[@]} == 0)); then
            echo 'no package dependencies were resolved' >&2
            exit 1
          fi
          pacman -S --needed --noconfirm "${dependencies[@]}"

      - name: Compute dependency key
        id: dependencies
        env:
          DEPENDENCY_HASH: ${{ hashFiles('PKGBUILD', '**/Cargo.toml', '**/Cargo.lock') }}
        run: echo "hash=$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo downloads
        id: cargo-downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: ${{ runner.os }}-arch-cargo-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-arch-cargo-

      - name: Fix Cargo cache ownership
        run: |
          install -d -o builder -g builder /home/builder/.cargo
          chown -R builder:builder /home/builder/.cargo

      - name: Install package dependencies and fetch sources
        run: |
          commit=$(sudo -u builder git rev-parse HEAD)
          sudo -u builder env HOME=/home/builder \
            OPLUS_CONNECT_SOURCE_URL="file://${GITHUB_WORKSPACE}#commit=${commit}" \
            makepkg --nodeps --nobuild --noconfirm --nosign

      - name: Fingerprint toolchain and system packages
        id: system
        run: |
          fingerprint=$( { rustc --version --verbose; pacman -Q; } | sha256sum | cut -d ' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore test artifacts
        id: cargo-test
        uses: actions/cache/restore@v6
        with:
          path: |
            oplus-connect-gui/target
            oplus-connect-daemon/target
          key: ${{ runner.os }}-arch-test-target-${{ steps.system.outputs.fingerprint }}-${{ steps.dependencies.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arch-test-target-${{ steps.system.outputs.fingerprint }}-${{ steps.dependencies.outputs.hash }}-

      - name: Fix test cache ownership
        run: |
          install -d -o builder -g builder oplus-connect-gui/target oplus-connect-daemon/target
          chown -R builder:builder oplus-connect-gui/target oplus-connect-daemon/target

      - name: Check formatting
        run: |
          sudo -u builder env HOME=/home/builder cargo fmt --manifest-path oplus-connect-gui/Cargo.toml -- --check
          sudo -u builder env HOME=/home/builder cargo fmt --manifest-path oplus-connect-daemon/Cargo.toml -- --check

      - name: Test GUI
        run: sudo -u builder env HOME=/home/builder CARGO_INCREMENTAL=0 cargo test --release --locked --manifest-path oplus-connect-gui/Cargo.toml

      - name: Test daemon
        run: sudo -u builder env HOME=/home/builder CARGO_INCREMENTAL=0 cargo test --release --locked --manifest-path oplus-connect-daemon/Cargo.toml

      - name: Save test artifacts
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            oplus-connect-gui/target
            oplus-connect-daemon/target
          key: ${{ steps.cargo-test.outputs.cache-primary-key }}

  build:
    name: Build package (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: pacman -Syu --needed --noconfirm git sudo rust zstd

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Resolve package dependencies
        run: |
          sudo -u builder env HOME=/home/builder bash -c \
            'source PKGBUILD && printf "%s\n" "${depends[@]}" "${makedepends[@]}"' \
            > "$RUNNER_TEMP/dependencies"

      - name: Install package dependencies
        run: |
          mapfile -t dependencies < <(grep -xE '^[[:alnum:]@._+\-]+$' "$RUNNER_TEMP/dependencies" | sort -u)
          if ((${#dependencies[@]} == 0)); then
            echo 'no package dependencies were resolved' >&2
            exit 1
          fi
          pacman -S --needed --noconfirm "${dependencies[@]}"

      - name: Compute dependency key
        id: dependencies
        env:
          DEPENDENCY_HASH: ${{ hashFiles('PKGBUILD', '**/Cargo.toml', '**/Cargo.lock') }}
        run: echo "hash=$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo downloads
        id: cargo-downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: ${{ runner.os }}-arch-cargo-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-arch-cargo-

      - name: Fix Cargo cache ownership
        run: |
          install -d -o builder -g builder /home/builder/.cargo
          chown -R builder:builder /home/builder/.cargo

      - name: Install package dependencies and fetch sources
        run: |
          commit=$(sudo -u builder git rev-parse HEAD)
          sudo -u builder env HOME=/home/builder \
            OPLUS_CONNECT_SOURCE_URL="file://${GITHUB_WORKSPACE}#commit=${commit}" \
            makepkg --nodeps --nobuild --noconfirm --nosign

      - name: Fingerprint toolchain and system packages
        id: system
        run: |
          fingerprint=$( { rustc --version --verbose; pacman -Q; } | sha256sum | cut -d ' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore compiled artifacts
        id: cargo-build
        uses: actions/cache/restore@v6
        with:
          path: src/target
          key: ${{ runner.os }}-arch-build-target-${{ steps.system.outputs.fingerprint }}-${{ steps.dependencies.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arch-build-target-${{ steps.system.outputs.fingerprint }}-${{ steps.dependencies.outputs.hash }}-

      - name: Fix build cache ownership
        run: |
          install -d -o builder -g builder src/target
          chown -R builder:builder src/target

      - name: Build package
        run: |
          commit=$(sudo -u builder git rev-parse HEAD)
          # A stable epoch avoids invalidating native build-script caches each run.
          sudo -u builder env HOME=/home/builder CARGO_INCREMENTAL=0 SOURCE_DATE_EPOCH=1 \
            OPLUS_CONNECT_SOURCE_URL="file://${GITHUB_WORKSPACE}#commit=${commit}" \
            makepkg --nodeps --noextract --nocheck --noconfirm --nosign

      - name: Save Cargo downloads
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

      - name: Save compiled artifacts
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src/target
          key: ${{ steps.cargo-build.outputs.cache-primary-key }}

      - name: Checksum package
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: sha256sum -- *.pkg.tar.zst > SHA256SUMS

      - name: Upload package
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: oplus-connect-arch-x86_64-${{ github.sha }}
          path: |
            *.pkg.tar.zst
            SHA256SUMS
          if-no-files-found: error
